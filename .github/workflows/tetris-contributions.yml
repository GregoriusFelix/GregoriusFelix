name: Refresh profile cards and contribution graph

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: profile-cards-and-contributions
  cancel-in-progress: false

jobs:
  generate:
    name: Refresh generated profile art
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SVG font subsetting tool
        run: python -m pip install fonttools

      - name: Refresh contribution data
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          from_date="$(date -u -d '365 days ago' '+%Y-%m-%dT00:00:00Z')"
          to_date="$(date -u '+%Y-%m-%dT23:59:59Z')"
          gh api graphql \
            -f query='query($login: String!, $from: DateTime!, $to: DateTime!) { user(login: $login) { contributionsCollection(from: $from, to: $to) { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }' \
            -F login="${GITHUB_REPOSITORY_OWNER}" \
            -F from="${from_date}" \
            -F to="${to_date}" > contributions.json

      - name: Render animated SVG cards
        run: python scripts/generate_cards.py

      - name: Commit refreshed contribution data and cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.json cards/
          if git diff --cached --quiet; then
            echo "Contribution data and cards are already current."
          else
            git commit -m "Refresh profile contribution cards"
            git push
          fi

      - name: Generate light and dark Tetris graphs
        uses: abozanona/pacman-contribution-graph@294c47eff28a41339a279107ae771b5fa020037a
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: tetris
          hide_month_labels: 'false'

      - name: Check generated SVGs
        shell: bash
        run: |
          test -s dist/tetris-contribution-graph.svg
          test -s dist/tetris-contribution-graph-dark.svg

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: Update Tetris contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
